name: debug-fetch
on: { push: { branches: [debug-fetch] } }
permissions: { contents: write }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36"
          B=https://manhwaus.net
          mkdir -p out
          g(){ echo "### $2 $1" >> out/log.txt; curl -sS -A "$UA" -L -w "final %{url_effective}\n"  -D out/$2.hdr -o out/$2 "$1"; echo "code $(head -1 out/$2.hdr) size $(wc -c < out/$2)" >> out/log.txt; }
          while read n u; do g "$u" $n.html; done < urls.txt
          for u in $(grep -oh '<link[^>]*stylesheet[^>]*>\|<link href=[^>]*>' out/search.html out/webtoons_rating.html | grep -o 'href="[^"]*"' | sed 's/href="//;s/"//' | sort -u); do
            case "$u" in //*) u="https:$u";; /*) u="$B$u";; esac
            n=css_$(basename "${u%%\?*}"); curl -sS -A "$UA" -L "$u" -o "out/$n"; echo "css $u -> $n" >> out/log.txt
          done
          git config user.name Din131; git config user.email Din131@users.noreply.github.com
          git add out; git commit -m "hasil"; git push
